<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테스트 데이터 추가</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>Firestore 테스트 데이터 추가</h1>
    <button onclick="addTestData()">24시간 소음 데이터 추가</button>
    <div id="status"></div>

    <script>
        // Firebase 초기화
        const firebaseConfig = {
            apiKey: "AIzaSyAauclmm4DAdTU8zxN_ZkdH0tXB0eHgll4",
            authDomain: "makinggood-2025.firebaseapp.com",
            projectId: "makinggood-2025",
            storageBucket: "makinggood-2025.firebasestorage.app",
            messagingSenderId: "718359291961",
            appId: "1:718359291961:web:dd3f7cd3c8639a02f905e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function addTestData() {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = '데이터 추가 중...';
            
            try {
                // 24시간 소음 데이터 (현실적인 패턴)
                const testData = {
                    values: [
                        35, 32, 28, 30,  // 0-3시: 새벽 (조용함)
                        40, 45, 50, 55,  // 4-7시: 새벽-아침 (점점 증가)
                        60, 65, 70, 68,  // 8-11시: 오전 활동 (높음)
                        55, 50, 45, 48,  // 12-15시: 점심-오후 (중간)
                        52, 58, 62, 65,  // 16-19시: 저녁 활동 (높음)
                        60, 55, 50, 45,  // 20-23시: 밤 (점점 감소)
                        40, 38           // 24시: 자정 (조용함)
                    ],
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                    description: "24시간 소음 레벨 데이터 (dB)"
                };

                await db.collection('metrics').doc('noise24h').set(testData);
                statusEl.innerHTML = '✅ 테스트 데이터가 성공적으로 추가되었습니다!<br>이제 홈 페이지에서 차트를 확인해보세요.';
                
            } catch (error) {
                console.error('데이터 추가 실패:', error);
                statusEl.innerHTML = `❌ 데이터 추가 실패: ${error.message}`;
            }
        }
    </script>
</body>
</html>
