<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테스트 데이터 추가</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>Firestore 테스트 데이터 추가</h1>
    <button onclick="addTestData()">24시간 소음 데이터 추가</button>
    <div id="status"></div>

    <script>
        // Firebase 초기화
        const firebaseConfig = {
            apiKey: "AIzaSyASGUmplriLiSlKtfqRo5Z-bfZce14KHaA",
            authDomain: "ohson-doson.firebaseapp.com",
            databaseURL: "https://ohson-doson-default-rtdb.firebaseio.com",
            projectId: "ohson-doson",
            storageBucket: "ohson-doson.firebasestorage.app",
            messagingSenderId: "227534929884",
            appId: "1:227534929884:web:807654b8a6afa325da5919",
            measurementId: "G-6HDSB5SD6C"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function addTestData() {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = '데이터 추가 중...';
            
            try {
                // 24시간 소음 데이터 (현실적인 패턴)
                const testData = {
                    values: [
                        35, 32, 28, 30,  // 0-3시: 새벽 (조용함)
                        40, 45, 50, 55,  // 4-7시: 새벽-아침 (점점 증가)
                        60, 65, 70, 68,  // 8-11시: 오전 활동 (높음)
                        55, 50, 45, 48,  // 12-15시: 점심-오후 (중간)
                        52, 58, 62, 65,  // 16-19시: 저녁 활동 (높음)
                        60, 55, 50, 45,  // 20-23시: 밤 (점점 감소)
                        40, 38           // 24시: 자정 (조용함)
                    ],
                    lastUpdated: firebase.database.ServerValue.TIMESTAMP,
                    description: "24시간 소음 레벨 데이터 (dB)"
                };

                await db.ref('metrics/noise24h').set(testData);
                statusEl.innerHTML = '✅ 테스트 데이터가 성공적으로 추가되었습니다!<br>이제 홈 페이지에서 차트를 확인해보세요.';
                
            } catch (error) {
                console.error('데이터 추가 실패:', error);
                statusEl.innerHTML = `❌ 데이터 추가 실패: ${error.message}`;
            }
        }
    </script>
</body>
</html>
